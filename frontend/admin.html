<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - File Integrity Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-change {
            font-size: 0.85em;
            margin-top: 8px;
        }
        
        .stat-change.positive {
            color: #10b981;
        }
        
        .stat-change.negative {
            color: #ef4444;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 0;
        }
        
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.3s;
            font-size: 1em;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th {
            background: #f9fafb;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .data-table tr:hover {
            background: #f9fafb;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85em;
        }
        
        .activity-item {
            padding: 15px;
            border-left: 3px solid #667eea;
            margin-bottom: 12px;
            background: #f9fafb;
            border-radius: 0 8px 8px 0;
        }
        
        .activity-time {
            font-size: 0.85em;
            color: #6b7280;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .chart-container {
            margin: 20px 0;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="api.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function AdminDashboard() {
            const [stats, setStats] = useState(null);
            const [users, setUsers] = useState([]);
            const [files, setFiles] = useState([]);
            const [verifications, setVerifications] = useState([]);
            const [timeline, setTimeline] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [activeTab, setActiveTab] = useState('overview');
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => {
                checkAuth();
                loadDashboardData();
            }, []);

            const checkAuth = () => {
                const token = api.getToken();
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }
                // Decode token to get user info
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    setCurrentUser(payload);
                    // Check if user is admin
                    if (payload.role !== 'admin' && !payload.is_admin) {
                        setError('Access denied. Admin privileges required.');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 2000);
                    }
                } catch (e) {
                    console.error('Token decode error:', e);
                }
            };

            const loadDashboardData = async () => {
                try {
                    setLoading(true);
                    setError('');

                    // Load stats
                    const statsData = await api.get('/api/v1/admin/stats');
                    setStats(statsData);

                    // Load users
                    const usersData = await api.get('/api/v1/admin/users?limit=100');
                    setUsers(usersData.users || []);

                    // Load files
                    const filesData = await api.get('/api/v1/admin/files?limit=100');
                    setFiles(filesData.files || []);

                    // Load verifications
                    const verifsData = await api.get('/api/v1/admin/verifications?limit=50');
                    setVerifications(verifsData.verifications || []);

                    // Load activity timeline
                    const timelineData = await api.get('/api/v1/admin/activity-timeline?hours=24');
                    setTimeline(timelineData.timeline || []);

                    setLoading(false);
                } catch (err) {
                    console.error('Error loading dashboard:', err);
                    setError('Failed to load dashboard data');
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                api.removeToken();
                window.location.href = 'login.html';
            };

            const toggleUserStatus = async (userId, currentStatus) => {
                try {
                    await api.patch(`/api/v1/admin/users/${userId}/status`, {
                        is_active: !currentStatus
                    });
                    setSuccess('User status updated');
                    loadDashboardData();
                    setTimeout(() => setSuccess(''), 3000);
                } catch (err) {
                    setError('Failed to update user status');
                    setTimeout(() => setError(''), 3000);
                }
            };

            const updateUserRole = async (userId, newRole) => {
                try {
                    await api.patch(`/api/v1/admin/users/${userId}/role`, {
                        role: newRole
                    });
                    setSuccess('User role updated');
                    loadDashboardData();
                    setTimeout(() => setSuccess(''), 3000);
                } catch (err) {
                    setError('Failed to update user role');
                    setTimeout(() => setError(''), 3000);
                }
            };

            const deleteFile = async (fileId) => {
                if (!confirm('Are you sure you want to permanently delete this file?')) {
                    return;
                }
                try {
                    await api.delete(`/api/v1/admin/files/${fileId}`);
                    setSuccess('File deleted successfully');
                    loadDashboardData();
                    setTimeout(() => setSuccess(''), 3000);
                } catch (err) {
                    setError('Failed to delete file');
                    setTimeout(() => setError(''), 3000);
                }
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                return new Date(dateStr).toLocaleString();
            };

            const formatBytes = (bytes) => {
                if (!bytes) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
            };

            if (loading) {
                return (
                    <div className="admin-container">
                        <div className="loading">
                            <h2>Loading Admin Dashboard...</h2>
                        </div>
                    </div>
                );
            }

            return (
                <div className="admin-container">
                    <div className="admin-header">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <div>
                                <h1 style={{margin: 0, fontSize: '2.5em'}}>Admin Dashboard</h1>
                                <p style={{margin: '10px 0 0 0', opacity: 0.9}}>
                                    File Integrity & Authenticity Verification Platform
                                </p>
                            </div>
                            <button className="btn btn-danger" onClick={handleLogout}>
                                Logout
                            </button>
                        </div>
                    </div>

                    {error && <div className="error-message">{error}</div>}
                    {success && <div className="success-message">{success}</div>}

                    {stats && (
                        <div className="stats-grid">
                            <div className="stat-card">
                                <div className="stat-label">Total Users</div>
                                <div className="stat-value">{stats.total_users}</div>
                                <div className="stat-change positive">
                                    +{stats.recent_users_24h} in last 24h
                                </div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">Total Files</div>
                                <div className="stat-value">{stats.total_files}</div>
                                <div className="stat-change positive">
                                    +{stats.recent_uploads_24h} in last 24h
                                </div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">Verifications</div>
                                <div className="stat-value">{stats.total_verifications}</div>
                                <div className="stat-change">
                                    {stats.recent_verifications_24h} in last 24h
                                </div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">Storage Used</div>
                                <div className="stat-value">{stats.total_storage_mb}MB</div>
                                <div className="stat-change">
                                    {formatBytes(stats.total_storage_bytes)}
                                </div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">Success Rate</div>
                                <div className="stat-value">{stats.verification_success_rate}%</div>
                                <div className="stat-change positive">
                                    Verification accuracy
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="tabs">
                        <button 
                            className={`tab ${activeTab === 'overview' ? 'active' : ''}`}
                            onClick={() => setActiveTab('overview')}
                        >
                            Overview
                        </button>
                        <button 
                            className={`tab ${activeTab === 'users' ? 'active' : ''}`}
                            onClick={() => setActiveTab('users')}
                        >
                            Users ({users.length})
                        </button>
                        <button 
                            className={`tab ${activeTab === 'files' ? 'active' : ''}`}
                            onClick={() => setActiveTab('files')}
                        >
                            Files ({files.length})
                        </button>
                        <button 
                            className={`tab ${activeTab === 'verifications' ? 'active' : ''}`}
                            onClick={() => setActiveTab('verifications')}
                        >
                            Verifications ({verifications.length})
                        </button>
                        <button 
                            className={`tab ${activeTab === 'activity' ? 'active' : ''}`}
                            onClick={() => setActiveTab('activity')}
                        >
                            Activity
                        </button>
                    </div>

                    <div className="tab-content">
                        {activeTab === 'overview' && (
                            <div>
                                <h2>Recent Activity</h2>
                                <div>
                                    {timeline.slice(0, 10).map((event, idx) => (
                                        <div key={idx} className="activity-item">
                                            <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                                <div>
                                                    <strong>{event.username}</strong> {event.type === 'upload' ? 'uploaded' : 'verified'} <strong>{event.filename}</strong>
                                                    {event.type === 'verification' && (
                                                        <span className={`badge ${event.verified ? 'badge-success' : 'badge-danger'}`} style={{marginLeft: '10px'}}>
                                                            {event.verified ? 'Verified' : 'Failed'}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="activity-time">{formatDate(event.timestamp)}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'users' && (
                            <div>
                                <h2>User Management</h2>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Username</th>
                                            <th>Email</th>
                                            <th>Role</th>
                                            <th>Status</th>
                                            <th>Created</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {users.map(user => (
                                            <tr key={user._id}>
                                                <td>{user.username}</td>
                                                <td>{user.email}</td>
                                                <td>
                                                    <select 
                                                        value={user.role || 'user'}
                                                        onChange={(e) => updateUserRole(user._id, e.target.value)}
                                                        className="btn btn-sm"
                                                    >
                                                        <option value="user">User</option>
                                                        <option value="admin">Admin</option>
                                                    </select>
                                                </td>
                                                <td>
                                                    <span className={`badge ${user.is_active ? 'badge-success' : 'badge-danger'}`}>
                                                        {user.is_active ? 'Active' : 'Inactive'}
                                                    </span>
                                                </td>
                                                <td>{formatDate(user.created_at)}</td>
                                                <td>
                                                    <button 
                                                        className={`btn btn-sm ${user.is_active ? 'btn-danger' : 'btn-primary'}`}
                                                        onClick={() => toggleUserStatus(user._id, user.is_active)}
                                                    >
                                                        {user.is_active ? 'Deactivate' : 'Activate'}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'files' && (
                            <div>
                                <h2>File Management</h2>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Filename</th>
                                            <th>Owner</th>
                                            <th>Size</th>
                                            <th>Upload Date</th>
                                            <th>Verifications</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {files.map(file => (
                                            <tr key={file._id}>
                                                <td>{file.filename}</td>
                                                <td>{file.username}</td>
                                                <td>{formatBytes(file.size)}</td>
                                                <td>{formatDate(file.upload_date)}</td>
                                                <td>{file.verification_count || 0}</td>
                                                <td>
                                                    <button 
                                                        className="btn btn-sm btn-danger"
                                                        onClick={() => deleteFile(file.file_id)}
                                                    >
                                                        Delete
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'verifications' && (
                            <div>
                                <h2>Verification Logs</h2>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Filename</th>
                                            <th>User</th>
                                            <th>Timestamp</th>
                                            <th>Hash Match</th>
                                            <th>Signature Valid</th>
                                            <th>Result</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {verifications.map(verif => (
                                            <tr key={verif._id}>
                                                <td>{verif.filename}</td>
                                                <td>{verif.username}</td>
                                                <td>{formatDate(verif.timestamp)}</td>
                                                <td>
                                                    <span className={`badge ${verif.hash_match ? 'badge-success' : 'badge-danger'}`}>
                                                        {verif.hash_match ? 'Match' : 'Mismatch'}
                                                    </span>
                                                </td>
                                                <td>
                                                    <span className={`badge ${verif.signature_valid ? 'badge-success' : 'badge-danger'}`}>
                                                        {verif.signature_valid ? 'Valid' : 'Invalid'}
                                                    </span>
                                                </td>
                                                <td>
                                                    <span className={`badge ${verif.verified ? 'badge-success' : 'badge-danger'}`}>
                                                        {verif.verified ? 'VERIFIED' : 'FAILED'}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'activity' && (
                            <div>
                                <h2>System Activity Timeline (Last 24h)</h2>
                                {timeline.map((event, idx) => (
                                    <div key={idx} className="activity-item">
                                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                            <div>
                                                <span className={`badge ${event.type === 'upload' ? 'badge-info' : 'badge-warning'}`}>
                                                    {event.type.toUpperCase()}
                                                </span>
                                                <strong style={{marginLeft: '10px'}}>{event.username}</strong>
                                                <span style={{margin: '0 10px', color: '#6b7280'}}>→</span>
                                                <strong>{event.filename}</strong>
                                                {event.type === 'verification' && (
                                                    <span className={`badge ${event.verified ? 'badge-success' : 'badge-danger'}`} style={{marginLeft: '10px'}}>
                                                        {event.verified ? '✓ Verified' : '✗ Failed'}
                                                    </span>
                                                )}
                                            </div>
                                            <div className="activity-time">{formatDate(event.timestamp)}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<AdminDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
