<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-box code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .result h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .result pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.online {
            background: #28a745;
        }

        .status-indicator.offline {
            background: #dc3545;
        }

        .server-status {
            margin-bottom: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
        }

        .quick-fill {
            margin-top: 10px;
            text-align: right;
        }

        .quick-fill a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .quick-fill a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Login Test</h1>
        <p class="subtitle">Test the admin authentication system</p>

        <div class="info-box">
            <h3>Default Admin Credentials</h3>
            <p>
                <strong>Username:</strong> <code>admin</code><br>
                <strong>Password:</strong> <code>admin123</code>
            </p>
        </div>

        <div class="server-status" id="serverStatus">
            <span class="status-indicator offline"></span>
            Checking backend server...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" value="admin" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="admin123" required>
            </div>

            <button type="submit" id="submitBtn">Test Login</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        const serverStatusEl = document.getElementById('serverStatus');
        const resultEl = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        const loginForm = document.getElementById('loginForm');

        // Check server status
        async function checkServerStatus() {
            try {
                const response = await fetch('http://localhost:8000/health');
                if (response.ok) {
                    const data = await response.json();
                    serverStatusEl.innerHTML = `
                        <span class="status-indicator online"></span>
                        Backend server is online (${data.version})
                    `;
                    serverStatusEl.style.background = '#d4edda';
                    return true;
                }
            } catch (err) {
                serverStatusEl.innerHTML = `
                    <span class="status-indicator offline"></span>
                    Backend server is offline - Please start the server
                `;
                serverStatusEl.style.background = '#f8d7da';
                return false;
            }
        }

        // Test login
        async function testLogin(username, password) {
            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Testing...';
                resultEl.style.display = 'none';

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    resultEl.className = 'result success';
                    resultEl.innerHTML = `
                        <h3>✅ Login Successful!</h3>
                        <p><strong>User:</strong> ${data.username} (${data.email})</p>
                        <p><strong>Admin:</strong> ${data.is_admin ? 'Yes' : 'No'}</p>
                        <p><strong>Token Type:</strong> ${data.token_type}</p>
                        <details>
                            <summary style="cursor: pointer; margin-top: 10px; font-weight: 600;">View Access Token</summary>
                            <pre>${data.access_token}</pre>
                        </details>
                        <details>
                            <summary style="cursor: pointer; margin-top: 10px; font-weight: 600;">Full Response</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    // Error
                    resultEl.className = 'result error';
                    resultEl.innerHTML = `
                        <h3>❌ Login Failed</h3>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Error:</strong> ${data.detail || 'Unknown error'}</p>
                        <details>
                            <summary style="cursor: pointer; margin-top: 10px; font-weight: 600;">Full Response</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                }

                resultEl.style.display = 'block';

            } catch (err) {
                resultEl.className = 'result error';
                resultEl.innerHTML = `
                    <h3>❌ Connection Error</h3>
                    <p><strong>Error:</strong> ${err.message}</p>
                    <p>Make sure the backend server is running on http://localhost:8000</p>
                    <details>
                        <summary style="cursor: pointer; margin-top: 10px; font-weight: 600;">Error Details</summary>
                        <pre>${err.stack}</pre>
                    </details>
                `;
                resultEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Test Login';
            }
        }

        // Form submit handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await testLogin(username, password);
        });

        // Check server status on load
        checkServerStatus();

        // Auto-refresh server status every 5 seconds
        setInterval(checkServerStatus, 5000);
    </script>
</body>
</html>
